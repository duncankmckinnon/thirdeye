name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu keeps the full supported-version sweep.
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          # Exercise Windows on the project's primary Python version.
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history for setuptools-scm

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev,ui,logfire]"

      - name: Run tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Coverage instrumentation adds meaningful overhead on top of
            # Windows's already-slower file I/O and process spawn, and only
            # the ubuntu/3.12 run's coverage is uploaded below. `-o addopts=`
            # clears pyproject's default `--cov` flags for this invocation.
            #
            # test_store_concurrency.py spawns 8 real subprocesses of its own
            # and asserts they finish within a fixed deadline; run it outside
            # the -n auto pool so it isn't also competing with three other
            # xdist workers for the runner's CPU, which made its timeout
            # flakier, not less so, under parallelism.
            pytest tests/ -n auto -o addopts="" -v --ignore=tests/shared/test_store_concurrency.py
            pytest tests/shared/test_store_concurrency.py -o addopts="" -v
          else
            pytest tests/ -n auto -v --cov-report=xml
          fi

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
