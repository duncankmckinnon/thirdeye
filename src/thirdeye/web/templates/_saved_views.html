<aside class="saved-views" id="saved-views-{{ page }}">
  <h3>Saved views</h3>
  {% if saved %}
    <ul>
      {% for v in saved %}
      <li>
        <a href="/{{ '' if page == 'sessions' else page }}{{ v.path }}">{{ v.name }}</a>
        <button class="x" type="button"
                hx-delete="/views/{{ page }}/{{ v.name }}"
                hx-target="#saved-views-{{ page }}"
                hx-confirm="Delete saved view '{{ v.name }}'?">×</button>
      </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="empty">No saved views yet.</p>
  {% endif %}
  <form class="save-view-form"
        hx-post="/views/{{ page }}"
        hx-target="#saved-views-{{ page }}"
        hx-vals='js:{path: window.location.search || "?"}'>
    <input type="text" name="name" placeholder="view name"
           pattern="^[a-zA-Z0-9 _\-]{1,64}$" required>
    <button type="submit">Save current</button>
  </form>
</aside>
