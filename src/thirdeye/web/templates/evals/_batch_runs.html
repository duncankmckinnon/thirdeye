<div class="batch-runs">
  <p>Dispatched <strong>{{ definition }}</strong> via <strong>{{ agent }}</strong> on {{ jobs | length }} session(s).</p>
  <ul>
    {% for j in jobs %}
      <li hx-get="/sessions/{{ j.sid }}/evals/runs/{{ j.run_id }}"
          hx-trigger="every 2s"
          hx-swap="outerHTML">
        {{ j.sid[:8] }} ({{ j.platform }}) — run {{ j.run_id[:8] }} — {{ j.status }}
      </li>
    {% endfor %}
  </ul>
</div>
