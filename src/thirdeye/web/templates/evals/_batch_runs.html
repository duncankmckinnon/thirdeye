<div class="batch-runs">
  <p>Dispatched <strong>{{ definition }}</strong> via <strong>{{ agent }}</strong> on {{ jobs | length }} session(s).</p>
  <div class="batch-runs-list">
    {% for j in jobs %}
      <div class="batch-run-item"
           hx-get="/sessions/{{ j.sid }}/evals/runs/{{ j.run_id }}/status"
           hx-trigger="every 2s"
           hx-swap="outerHTML">
        <a href="/sessions/{{ j.sid }}/evals/runs/{{ j.run_id }}">{{ j.sid[:8] }}</a>
        ({{ j.platform }}) — run {{ j.run_id[:8] }} — {{ j.status }}
      </div>
    {% endfor %}
  </div>
</div>
