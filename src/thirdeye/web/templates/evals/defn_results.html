{% extends "base.html" %}
{% block title %}evals: {{ defn_name }}{% endblock %}
{% block content %}
<section class="eval-defn-results">
  <h1>Runs for <code>{{ defn_name }}</code></h1>

  {% endif %}
</section>
{% endblock %}
