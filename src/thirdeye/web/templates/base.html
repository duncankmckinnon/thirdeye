<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}thirdeye{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/index.css">
  <link rel="stylesheet" href="/static/sessions.css">
  <link rel="stylesheet" href="/static/events.css">
  <link rel="stylesheet" href="/static/search.css">
  <link rel="stylesheet" href="/static/usage.css">
  <link rel="stylesheet" href="/static/evals.css">
  <script src="/static/htmx.min.js"></script>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">thirdeye</a>
    <form class="topbar-search" method="get" action="/search" role="search">
      <input type="search" name="q" placeholder="search events" aria-label="Search events"
             value="{{ topbar_query or '' }}">
    </form>
    <nav>
      <a href="/search">search</a>
      <a href="/evals/defs">evals</a>
      <a href="/usage">usage</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
